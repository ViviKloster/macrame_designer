name: macrame_designer
description: Aplicación de diseño y cálculo de macramé
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  flutter_svg: ^2.2.3
  hive: ^2.2.3
  vector_math: ^2.2.0
  mysql1: ^0.20.0   
  http: ^1.2.0
  image_picker: ^1.0.4
  url_launcher: ^6.1.14

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

fonts:   
  - family: Roboto
    fonts:
  - asset: fonts/Roboto-Regular.ttf
  - asset: fonts/Roboto-Bold.ttf
    weight: 700
    
  - family: OpenSans
    fonts:
      - asset: fonts/OpenSans-Regular.ttf
      - asset: fonts/OpenSans-Bold.ttf
        weight: 700

assets:
  - assets/
  - assets/images/ 